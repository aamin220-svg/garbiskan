<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>إدارة طلبات الأعضاء</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f3ed;margin:0;color:#172b3a}.wrap{max-width:1200px;margin:40px auto;padding:0 18px}.card{background:#fff;border:1px solid #ddd6c8;border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:0 8px 25px rgba(0,0,0,.05)}h1{margin-top:0}.grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}input,select,button,textarea{font:inherit;padding:11px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}button{cursor:pointer;background:#d9a441;border:0;font-weight:700}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1000px}th,td{padding:11px;border-bottom:1px solid #eee;text-align:right;vertical-align:top}th{background:#f8f6f0}.msg{margin:10px 0;padding:10px;border-radius:8px;background:#f3f3f3}.small{font-size:12px;color:#666}.actions{display:flex;gap:7px;align-items:center}.actions select{width:140px}.actions input{width:220px}</style>
</head>
<body><div class="wrap">
<div class="card"><h1>طلبات ومراسلات الأعضاء</h1><p class="small">هذه الصفحة مخصصة لإدارة الجمعية. أدخل مفتاح الإدارة للبحث ومراجعة الطلبات.</p>
<div class="grid"><input id="key" type="password" placeholder="مفتاح الإدارة"><input id="q" placeholder="بحث بالاسم أو رقم العضوية أو الموبايل أو الرقم القومي أو نص الرسالة"><select id="status"><option value="">كل الحالات</option><option>جديد</option><option>قيد المراجعة</option><option>تم الرد</option><option>مغلق</option></select></div><br><button onclick="loadRequests()">بحث وتحديث</button><div id="msg" class="msg"></div></div>
<div class="card table-wrap"><table><thead><tr><th>رقم الطلب</th><th>التاريخ</th><th>بيانات العضو</th><th>الرسالة</th><th>الحالة / الملاحظة</th></tr></thead><tbody id="rows"></tbody></table></div>
</div>
<script>
async function loadRequests(){const key=document.getElementById('key').value.trim();const q=encodeURIComponent(document.getElementById('q').value.trim());const status=encodeURIComponent(document.getElementById('status').value);const msg=document.getElementById('msg');msg.textContent='جارٍ التحميل...';try{const r=await fetch('/api/admin/requests?key='+encodeURIComponent(key)+'&q='+q+'&status='+status);const d=await r.json();if(!r.ok)throw Error(d.message||'تعذر تحميل الطلبات');render(d.requests||[]);msg.textContent='تم تحميل '+(d.requests||[]).length+' طلب.';}catch(e){msg.textContent=e.message;}}
function render(items){document.getElementById('rows').innerHTML=items.map(r=>`<tr><td>#${r.id}</td><td>${new Date(r.createdAt).toLocaleString('ar-EG')}</td><td><b>${esc(r.name)}</b><br>عضوية: ${esc(r.member_number)}<br>موبايل: ${esc(r.phone)}<br>الإدارة: ${esc(r.area)}<br>قومي: ${esc(r.national_id)}</td><td style="white-space:pre-wrap;max-width:420px">${esc(r.message)}</td><td><div class="actions"><select id="s${r.id}">${['جديد','قيد المراجعة','تم الرد','مغلق'].map(x=>`<option ${x===r.status?'selected':''}>${x}</option>`).join('')}</select><input id="n${r.id}" value="${escAttr(r.admin_note||'')}" placeholder="ملاحظة الإدارة"><button onclick="save(${r.id})">حفظ</button></div></td></tr>`).join('')||'<tr><td colspan="5">لا توجد طلبات.</td></tr>';}
async function save(id){const key=document.getElementById('key').value.trim();const status=document.getElementById('s'+id).value;const adminNote=document.getElementById('n'+id).value;const r=await fetch('/api/admin/requests/'+id,{method:'PATCH',headers:{'Content-Type':'application/json','x-admin-key':key},body:JSON.stringify({status,adminNote})});const d=await r.json();document.getElementById('msg').textContent=d.message||'تم';if(r.ok)loadRequests();}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}function escAttr(v){return esc(v).replace(/
/g,' ');}
</script></body></html>
